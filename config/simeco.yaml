name: SIMECO
num_query: 64 
skeleton_num: 48
num_points: 16384
center_num: [512, 256]
global_feature_dim: 1024
bias_epsilon: 0.000001

encoder_type: vecgraph
decoder_type: fc
query_selection: true

rgb_dim: 128

encoder_config:
  embed_dim: 256
  depth: 2
  num_heads: 4
  k: 8
  mlp_ratio: 2.
  block_style_list: ['vnattn-vngraph', 'vnattn']
  combine_style: 'concat'
  bias_epsilon: 0.000001
  scale_factor: 1.0

decoder_config:
  embed_dim: 256
  depth: 2
  num_heads: 4
  k: 8
  proxy_obj_k: 4
  mlp_ratio: 2.
  self_attn_block_style_list: ['vnattn-vngraph', 'vnattn']
  self_attn_combine_style: 'concat'
  cross_attn_block_style_list: ['vnattn-vngraph', 'vnattn']
  cross_attn_combine_style: 'concat'
  bias_epsilon: 0.000001
  scale_factor: 1.0
